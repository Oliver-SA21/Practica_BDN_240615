const colCount=T.reduce((s,t)=>s+t.columns.length,0),rowCount=T.reduce((s,t)=>s+t.rows,0),related=n=>R.filter(r=>r.from===n||r.to===n),inferred='<span class="pill inferred">Descripción inferida</span>';
const sections=[['home','⌂','Inicio'],['tables','▦','Explorador de tablas'],['der','◇','Diagrama ER'],['relations','⇄','Relaciones entre tablas'],['glossary','≡','Glosario de términos'],['stats','▥','Estadísticas']];
let current='home',selected=null,filterType='',diagramSelection='',diagramQuery='',onlyConnected=false;
$('#dbTag').textContent=D.database+' · MySQL 8.0.46';
$('nav').innerHTML=sections.map(([id,icon,label])=>`<button data-view="${id}"><span aria-hidden="true">${icon}</span> &nbsp;${label}</button>`).join('');
function heading(k,title,sub){return `<div class="heading"><div class="eyebrow">${k}</div><h1>${title}</h1><p class="muted">${sub}</p></div>`}
function metrics(){return `<div class="stats">${[[T.length,'Tablas documentadas'],[colCount,'Columnas en total'],[rowCount,'Registros en INSERT'],[R.length,'Claves foráneas']].map(([v,l])=>`<div class="metric"><small>${l}</small><strong>${fmt(v)}</strong></div>`).join('')}</div>`}
function go(view,name){current=view;selected=name||null;$('#results').hidden=true;document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#app').className='view';$('#app').innerHTML=({home:home,tables:tables,der:der,relations:relations,glossary:glossary,stats:stats})[view]();if(view==='der')initDiagram();window.scrollTo(0,0)}
function home(){return heading('Documentación del modelo','Diccionario de Datos Interactivo',`Una guía para entender la información de <strong>${esc(D.database)}</strong>.`)+`<div class="hero"><div class="eyebrow">De la estructura al significado</div><h2>Conoce la información de tu operación</h2><p>El modelo parece gestionar un comercio con productos, usuarios, proveedores, carritos, órdenes, pagos y entregas. Esta interpretación se infiere de la estructura; el respaldo no documenta el propósito de negocio.</p>${inferred}<div class="row" style="margin-top:18px"><button data-view="tables">Explorar tablas →</button><button data-view="der">Abrir diagrama ER ◇</button></div></div>`+metrics()+`<div class="two"><div class="panel"><h2>Empieza por lo que necesitas</h2><p class="muted">Los nombres originales se conservan junto a explicaciones en lenguaje sencillo.</p><div class="row"><button data-open="tb_products">Productos</button><button data-open="tb_users">Usuarios</button><button data-open="tb_buyer_orders">Órdenes</button></div><div class="note">Todas las descripciones funcionales y la clasificación Base / Catálogo / Detalle son inferidas. Las tablas, campos, tipos y restricciones proceden del SQL original.</div></div><div class="panel"><h2>Cómo se verificó la información</h2><p>Se contaron las tuplas de los INSERT de carga, incluyendo inserciones múltiples. Se excluyeron los INSERT definidos dentro de triggers y rutinas. AUTO_INCREMENT no se utilizó como conteo.</p><p class="muted">Una tabla con 0 filas no contiene INSERT de carga en este respaldo. Estos totales describen los datos respaldados, no una ejecución de procedimientos o una restauración con efectos adicionales.</p></div></div><div class="panel"><h2>Observaciones del modelo</h2>${limitations()}<details><summary>Otros objetos presentes en el respaldo</summary><p>${D.objects.views.length} vistas, ${D.objects.triggers.length} triggers y ${D.objects.routines.length} rutinas. Se inventarían aparte: no se contabilizan como tablas ni como registros.</p>${[['Vistas',D.objects.views],['Triggers',D.objects.triggers.map(x=>x.name+' · '+x.timing+' '+x.event+' · '+x.table)],['Rutinas',D.objects.routines.map(x=>x.type+' '+x.name)]].map(([title,a])=>`<details><summary>${title} (${a.length})</summary><pre>${a.map(esc).join('\n')}</pre></details>`).join('')}</details><details><summary>Procedencia y huella de verificación</summary><p>${esc(D.source)}</p><p>SHA-256: <code>${D.sha256}</code></p><p>Motor, codificación y opciones se conservan en el detalle de cada tabla. No se ejecutó el SQL ni se modificó el respaldo.</p></details></div>`}
function limitations(){return `<p>No hay descripciones de negocio explícitas. La moneda y el significado exacto de los indicadores binarios no están especificados.</p><p>Hay campos con nombres de identificador sin clave foránea declarada: no se representan como relaciones.</p><p>${R.filter(r=>!r.targetUnique).length} claves foráneas apuntan a columnas no únicas de <code>tbd_products_users_providers</code>. Su vínculo no garantiza un único registro de destino; el DER lo señala expresamente.</p><p>Los ejemplos de cuentas, personas, bitácora y referencias de pago se omiten para proteger datos sensibles. Los conteos sí incluyen todas sus filas.</p>`}
function tableCard(t){return `<article class="card"><span class="pill">${esc(t.kind)} · clasificación inferida</span><h3>${esc(t.friendly)}</h3><code>${esc(t.name)}</code><p>${esc(t.description)}</p>${inferred}<small>${t.columns.length} columnas · ${fmt(t.rows)} registros · ${related(t.name).length} relaciones</small><button data-open="${t.name}">Consultar detalle →</button></article>`}
function tables(){if(selected)return detail(M[selected]);return heading('Módulo 01 · Diccionario','Explorador de tablas','Encuentra el significado de cada tabla y sus campos.')+`<div class="row between section-label"><label>Buscar tabla <input id="tableSearch" type="search" placeholder="Nombre o descripción"></label><span class="muted" id="tableCount">${T.length} tablas</span></div><div class="grid" id="tableGrid">${T.map(tableCard).join('')}</div>`}
function friendlyType(type){if(/^(bit|tinyint\(1\))/.test(type))return 'Indicador binario';if(/^(int|bigint|smallint|tinyint)/.test(type))return 'Número entero';if(/^(decimal|float|double)/.test(type))return 'Número con decimales';if(/^(datetime|timestamp)/.test(type))return 'Fecha y hora';if(/^date/.test(type))return 'Fecha';if(/^enum/.test(type))return 'Lista de opciones';return 'Texto'}
function badges(c){return (c.pk?'<span class="pill pk">PK · Llave primaria</span>':'')+(c.fk?'<span class="pill fk">FK · Llave foránea</span>':'')+`<span class="pill ${c.nullable?'null':''}">${c.nullable?'◯ Permite NULL':'✳ Obligatorio'}</span>`+(c.auto?'<span class="pill">↗ Autoincremental</span>':'')+c.unique.map(u=>`<span class="pill pk">★ UNIQUE: ${esc(u)}</span>`).join('')+(c.default!==null?`<span class="pill">⚙ Predeterminado: ${esc(c.default)}</span>`:'<small>Predeterminado: no especificado</small>')+(/GENERATED/.test(c.attributes)?'<span class="pill">Calculado · STORED</span>':'')+(/ON UPDATE/.test(c.attributes)?'<span class="pill">Actualización automática</span>':'')}
function columnRows(t,q=''){return t.columns.filter(c=>!q||c.type===q).map(c=>`<tr id="field-${esc(c.name)}"><td><code><strong>${esc(c.name)}</strong></code></td><td><code>${esc(c.type)}</code></td><td>${friendlyType(c.type)}</td><td>${esc(c.description)}<br>${inferred}</td><td class="attrs">${badges(c)}<details><summary>Atributos SQL exactos</summary><code>${esc(c.attributes||'No especificado')}</code></details></td></tr>`).join('')}
function detail(t){return `<div class="heading"><button data-view="tables">← Todas las tablas</button><h1>${esc(t.friendly)}</h1><code>${esc(t.name)}</code><p>${esc(t.description)} ${inferred}</p></div><div class="stats">${[[fmt(t.rows),'Registros respaldados'],[t.columns.length,'Columnas'],[related(t.name).length,'Relaciones declaradas'],[t.pk.join(' + ')||'No especificado','Llave primaria']].map(([a,b])=>`<div class="metric"><small>${b}</small><strong style="font-size:${String(a).length>18?'16':'26'}px">${esc(a)}</strong></div>`).join('')}</div><div class="panel"><div class="row between"><h2>Diccionario de columnas</h2><label>Tipo SQL <select id="typeFilter"><option value="">Todos los tipos</option>${[...new Set(t.columns.map(c=>c.type))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></label></div><p class="muted">Obligatorio significa NOT NULL; un valor automático o predeterminado puede completarlo.</p><div class="scroll"><table><thead><tr>${['Campo técnico','Tipo SQL original','Tipo amigable','Descripción','Atributos'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody id="columnsBody">${columnRows(t)}</tbody></table></div></div><div class="panel"><h2>Relaciones de esta tabla</h2>${related(t.name).length?related(t.name).map(relCard).join(''):'<p class="muted">No hay claves foráneas declaradas hacia o desde esta tabla.</p>'}<button data-diagram="${t.name}">Ver conexiones en el DER</button></div><div class="panel"><h2>Restricciones e índices</h2><p>PRIMARY KEY: <code>${esc(t.pk.join(', ')||'No especificado')}</code></p>${[...t.unique.map(u=>u.sql),...t.indexes.map(u=>u.sql),...t.checks].map(x=>`<pre>${esc(x)}</pre>`).join('')||'<p>No hay restricciones adicionales ni índices secundarios explícitos.</p>'}<details><summary>Definición SQL original de la tabla</summary><pre>${esc(t.ddl)}</pre></details><p class="muted">${esc(t.options)}</p></div><div class="panel"><h2>Ejemplos del respaldo</h2>${t.samples.length?`<p>Primeras ${t.samples.length} filas de carga; muestras limitadas a información de catálogo.</p><div class="scroll"><table><thead><tr>${t.columns.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${t.samples.map(row=>`<tr>${t.columns.map(c=>`<td>${esc(/[\x00-\x1f]/.test(row[c.name])?'Valor binario (no representado)':row[c.name])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:t.rows?'Ejemplos omitidos por privacidad. Los conteos de filas se conservan.':'No disponible en el respaldo: esta tabla no contiene INSERT de carga.'}</div>`}
function cardinal(r){return r.targetUnique?(r.sourceUnique?'1:1':'1:N'):'Destino no único · sin cardinalidad 1:N garantizada'}
function relExplanation(r){return `Cada registro de ${M[r.from].friendly} utiliza ${r.columns.join(' + ')} para referirse a ${r.target.join(' + ')} en ${M[r.to].friendly}. `+(r.targetUnique?`La clave de destino es única. ${r.optional?'El vínculo puede estar ausente si algún componente es NULL.':'La referencia es obligatoria (NOT NULL).'} ${r.sourceUnique?'La referencia es única en el origen: como máximo un registro de origen por destino.':'Un destino puede ser referido por varios registros de origen.'} No se obliga a cada destino a tener registros de origen.`:'Las columnas de destino no son únicas por separado: una referencia puede coincidir con varios registros. No se presupone que las FK separadas identifiquen la misma pareja proveedor/producto.')}
function relCard(r){return `<details class="relation"><summary><code>${esc(r.from)}</code> → <code>${esc(r.to)}</code> <span class="pill">${cardinal(r)}</span></summary><p><code>${esc(r.columns.join(', '))}</code> → <code>${esc(r.target.join(', '))}</code></p><p>${esc(relExplanation(r))}</p><p><strong>FOREIGN KEY</strong> · <code>${esc(r.name)}</code><br>${esc(r.actions)}</p><div class="row"><button data-open="${r.from}">Origen</button><button data-open="${r.to}">Destino</button><button data-rel="${r.id}">Localizar en DER</button></div><pre>${esc(r.sql)}</pre></details>`}
function relations(){return heading('Integridad referencial','Relaciones entre tablas','Sólo se muestran conexiones respaldadas por FOREIGN KEY.')+`<div class="panel"><label>Filtrar por tabla <select id="relationFilter"><option value="">Todas las tablas</option>${T.map(t=>`<option value="${t.name}">${t.name}</option>`).join('')}</select></label><p class="muted">1:N se expresa desde la tabla referenciada hacia la tabla de origen. La obligatoriedad de cada extremo se explica en el detalle.</p><div id="relationList">${R.map(relCard).join('')}</div></div><div class="panel"><h2>Asociaciones de muchos a muchos</h2><p>Las tablas puente con dos claves foráneas hacia destinos únicos y clave primaria formada por ambos identificadores permiten asociaciones N:M. Se representan mediante sus dos FK reales.</p>${T.filter(t=>t.fks.length===2&&t.pk.length===2&&t.fks.every(f=>f.columns.length===1&&t.pk.includes(f.columns[0])&&R.find(r=>r.name===f.name).targetUnique)).map(t=>`<p><button data-open="${t.name}">${esc(t.name)}</button> · ${t.fks.map(f=>esc(f.to)).join(' ↔ ')} · N:M permitido por el modelo</p>`).join('')}</div>`}
const glossaryData=[['Tabla','Conjunto de información del mismo tema, organizado en filas y columnas.',()=>`Productos se guarda en ${M.tb_products.name}.`],['Columna','Dato que se guarda para cada elemento de una tabla.',()=> 'current_price almacena el precio del producto.'],['Registro','Una fila que describe un elemento.',()=>`tb_products tiene ${fmt(M.tb_products.rows)} filas de carga.`],['Llave primaria','Campo o conjunto de campos que identifica de forma única cada fila.',()=> 'tb_users utiliza ID; tbd_products_categorias utiliza product_id + category_id.'],['Llave foránea','Regla que comprueba que una referencia existe en otra tabla o en la misma.',()=> 'tb_carts.user_ID referencia tb_users.ID.'],['Relación','Conexión declarada entre información de dos tablas.',()=> 'El carrito se conecta con su usuario mediante una FK.'],['Identificador','Valor usado para distinguir o referirse a un elemento. Su nombre por sí solo no crea una relación.',()=> 'tb_payments.order_ID no tiene una FK declarada en el respaldo.'],['NULL','Ausencia de un valor conocido; no equivale a cero ni a texto vacío.',()=> 'tb_people.birth_date permite NULL.'],['Valor predeterminado','Valor que se usa cuando una inserción no proporciona uno.',()=> 'tb_products.current_stock tiene DEFAULT 0.'],['AUTO_INCREMENT','Asignación automática de nuevos identificadores numéricos. No indica cuántas filas hay.',()=> 'tb_products.ID es autoincremental.'],['Restricción UNIQUE','Regla que evita valores repetidos; si abarca varios campos evita repetir la combinación.',()=> 'tb_products.SKU es único; uk_provider_method es una regla compuesta.'],['Índice','Estructura que facilita localizar filas. Un índice ordinario no exige valores únicos.',()=> 'idx_user_addresses indexa user_ID.'],['Tipo de dato','Regla sobre qué clase de valor puede contener un campo.',()=> 'current_price usa decimal(10,2), hasta diez dígitos con dos decimales.'],['Integridad referencial','Reglas que mantienen coherencia entre las referencias y sus destinos.',()=> 'fk_component_address tiene ON DELETE RESTRICT.'],['CHECK','Condición que los datos deben cumplir.',()=> 'chk_cart_quantity exige quantity > 0.'],['Campo calculado','Valor que la base de datos calcula a partir de otros campos.',()=> 'tbd_order_items.subtotal es quantity × unit_price, GENERATED ALWAYS y STORED.'],['Cardinalidad','Indica cuántos registros pueden vincularse: uno a uno, uno a muchos o muchos a muchos.',()=> 'tb_carts.user_ID es UNIQUE: como máximo un carrito por usuario.']];
function glossary(){return heading('Guía de lectura','Glosario de términos','Conceptos sencillos con ejemplos tomados del modelo real.')+`<div class="grid">${glossaryData.map(([term,d,example],i)=>`<article class="card" id="term-${i}"><h3>${term}</h3><p>${d}</p><small>${esc(example())}</small></article>`).join('')}</div>`}
function bars(title,items,clickable=false){let max=Math.max(1,...items.map(x=>x[1]));return `<div class="panel"><h2>${title}</h2>${items.map(([label,n,key])=>`<div class="barrow">${clickable?`<button data-open="${key}" title="${esc(label)}">${esc(label)}</button>`:`<span>${esc(label)}</span>`}<div class="track" role="img" aria-label="${esc(label)}: ${n}"><div class="fill" style="width:${n/max*100}%"></div></div><strong>${fmt(n)}</strong></div>`).join('')}</div>`}
function stats(){let types={};for(let t of T)for(let c of t.columns){let k=c.type.match(/^[a-z]+/i)[0];types[k]=(types[k]||0)+1}let required=T.flatMap(t=>t.columns).filter(c=>!c.nullable).length;return heading('Análisis estructural','Estadísticas de la base de datos','Cifras calculadas a partir de la estructura y las filas de carga del respaldo.')+metrics()+`<div class="two">${bars('Tablas con más registros',T.filter(t=>t.rows).sort((a,b)=>b.rows-a.rows).map(t=>[t.name,t.rows,t.name]),true)}${bars('Tablas con más columnas · primeras 10',[...T].sort((a,b)=>b.columns.length-a.columns.length).slice(0,10).map(t=>[t.name,t.columns.length,t.name]),true)}${bars('Distribución de tipos SQL',Object.entries(types).sort((a,b)=>b[1]-a[1]))}${bars('Tablas con más relaciones · primeras 10',[...T].sort((a,b)=>related(b.name).length-related(a.name).length).slice(0,10).map(t=>[t.name,related(t.name).length,t.name]),true)}${bars('Campos obligatorios y opcionales',[['NOT NULL · obligatorios',required],['Permiten NULL · opcionales',colCount-required]])}<div class="panel"><h2>Lectura de las cifras</h2><p>Los tipos se agrupan por familia SQL. Las relaciones cuentan cada FK entrante o saliente una vez por tabla, incluyendo autorreferencias.</p><p>Los gráficos parten de ${fmt(colCount)} columnas y ${fmt(rowCount)} filas explícitas. Las tablas sin INSERT tienen 0 filas de carga.</p></div></div>`}
function der(){return heading('Módulo 02 · Modelo de datos','Diagrama Entidad–Relación','Arrastra las entidades para reorganizarlas. Arrastra el fondo para desplazarte; usa la rueda para acercarte.')+`<div class="panel"><div class="row"><label>Entidad <input id="entitySearch" type="search" placeholder="Nombre técnico o amigable" value="${esc(diagramQuery)}"></label><label>Seleccionar <select id="entitySelect"><option value="">Todo el modelo</option>${T.map(t=>`<option value="${t.name}" ${t.name===diagramSelection?'selected':''}>${t.name}</option>`).join('')}</select></label><label><input id="onlyConnected" type="checkbox" ${onlyConnected?'checked':''}> Sólo conexiones de la seleccionada</label></div><div class="row" style="margin:15px 0"><button id="zoomIn" aria-label="Acercar">＋</button><button id="zoomOut" aria-label="Alejar">−</button><button id="fit">Ajustar al contenido</button><button id="resetLayout">Reorganizar</button><button id="exportSvg">Exportar SVG</button><button id="exportPng">Exportar PNG</button><span id="zoomLabel" class="muted"></span></div><div class="legend"><span>🟦 Base</span><span>🟩 Catálogo</span><span>🟪 Detalle / relación</span><span>PK: llave primaria</span><span>FK: llave foránea</span><span>○│ = 0…1 &nbsp; ││ = 1 &nbsp; ○⋔ = 0…N</span><span>Clasificación funcional inferida</span></div><div id="stage" aria-label="Diagrama interactivo; use también los selectores y controles de zoom"></div><div id="relInfo" aria-live="polite">Selecciona una entidad o una línea para consultar su explicación. Los nombres y tipos completos también están disponibles en el diccionario.</div><div class="note">La pata de gallo muestra las cotas permitidas por las restricciones, no cantidades reales de filas. Las FK a destinos no únicos aparecen discontinuas y sin una cardinalidad singular inventada. Para las asociaciones N:M se dibujan las dos FK de la tabla puente.</div></div>`}
let positions={},visibleNames=[],visibleR=[],zoom=1,pan={x:20,y:20},activeRel=null;
const NS='http://www.w3.org/2000/svg',W=400,rowH=24,height=t=>90+t.columns.length*rowH;
function defaultPositions(){T.forEach((t,i)=>positions[t.name]={x:40+(i%5)*530,y:40+Math.floor(i/5)*510})}
defaultPositions();
function diagramSubset(){let set=new Set(T.filter(t=>!diagramQuery||norm(t.name+' '+t.friendly).includes(norm(diagramQuery))).map(t=>t.name));if(diagramSelection&&onlyConnected){let conn=new Set([diagramSelection,...related(diagramSelection).flatMap(r=>[r.from,r.to])]);set=new Set([...set].filter(n=>conn.has(n)))}visibleNames=[...set];visibleR=R.filter(r=>set.has(r.from)&&set.has(r.to))}
function svgText(x,y,text,attrs=''){return `<text x="${x}" y="${y}" ${attrs}>${esc(text)}</text>`}
function endMarker(x,y,side,mode,optional){let sign=side==='right'?1:-1,at=d=>x+sign*d;let s='';if(mode==='many')s+=`<path d="M ${x} ${y-8} L ${at(13)} ${y} L ${x} ${y+8} M ${x} ${y} L ${at(13)} ${y}"/>`;else s+=`<path d="M ${at(5)} ${y-8} V ${y+8}"/>`;s+=optional?`<circle cx="${at(22)}" cy="${y}" r="5" fill="white"/>`:`<path d="M ${at(18)} ${y-8} V ${y+8}"/>`;return `<g stroke="#557a9c" stroke-width="1.6" fill="none" pointer-events="none">${s}</g>`}
function edgeMarkup(r){let a=positions[r.from],b=positions[r.to],self=r.from===r.to,forward=b.x>=a.x;let x1=a.x+(self||forward?W:0),x2=b.x+(forward&&!self?0:W),y1=a.y+86+M[r.from].columns.findIndex(c=>c.name===r.columns[0])*rowH,y2=b.y+86+M[r.to].columns.findIndex(c=>c.name===r.target[0])*rowH;let path;if(self){let reach=x1+65+(r.id%3)*20;path=`M${x1},${y1} C${reach},${y1} ${reach},${y2} ${x2},${y2}`}else{let dx=Math.max(65,Math.abs(x2-x1)*.45);path=`M${x1},${y1} C${x1+(forward?dx:-dx)},${y1} ${x2+(forward?-dx:dx)},${y2} ${x2},${y2}`}let hot=r.id===activeRel||(diagramSelection&&(r.from===diagramSelection||r.to===diagramSelection));return `<g data-edge="${r.id}"><path class="edgehit" d="${path}"/><path class="edge ${hot?'hot':''}" d="${path}" ${!r.targetUnique?'stroke-dasharray="7 5"':''}/>${r.targetUnique?endMarker(x1,y1,self||forward?'right':'left',r.sourceUnique?'one':'many',true)+endMarker(x2,y2,forward&&!self?'left':'right','one',r.optional):''}${svgText((x1+x2)/2+(self?75:0),(y1+y2)/2-8,r.targetUnique?(r.sourceUnique?'1:1':'1:N'):'Destino no único','class="edge-label"')}</g>`}
function nodeMarkup(t){let p=positions[t.name],h=height(t),selected=t.name===diagramSelection,kind=t.kind==='Catálogo'?'catalog':t.kind==='Base'?'':'detail';return `<g data-node="${t.name}" class="entity ${kind} ${selected?'selected':''}" transform="translate(${p.x},${p.y})"><title>${esc(t.name+' — '+t.friendly)}</title><rect class="frame" width="${W}" height="${h}" rx="12"/><path class="head" d="M12 0 H${W-12} Q${W} 0 ${W} 12 V68 H0 V12 Q0 0 12 0"/>${svgText(14,25,t.name,'fill="white" font-size="13" font-weight="700"')}${svgText(14,48,t.friendly,'fill="#dcecf9" font-size="12"')}${t.columns.map((c,i)=>`${i%2===0?`<rect x="1" y="${71+i*rowH}" width="${W-2}" height="${rowH}" fill="#f3f7fb"/>`:''}${svgText(12,88+i*rowH,(c.pk?'PK ':'')+(c.fk?'FK':''),'fill="'+(c.pk?'#8c6b15':'#2875b2')+'" font-size="10" font-weight="700"')}${svgText(55,88+i*rowH,c.name,'fill="#17344e" font-size="11"')}${svgText(246,88+i*rowH,c.type.length>21?c.type.slice(0,19)+'…':c.type,'fill="#65778b" font-size="10"')}<title>${esc(c.name+' '+c.type+' '+c.attributes)}</title>`).join('')}</g>`}
function draw(){diagramSubset();$('#stage').innerHTML=`<svg xmlns="${NS}" id="modelSvg"><g id="world">${visibleR.map(edgeMarkup).join('')}${visibleNames.map(n=>nodeMarkup(M[n])).join('')}</g></svg>`;transform();$('#entitySelect').value=diagramSelection;if(!visibleNames.length)$('#relInfo').textContent='No hay entidades que coincidan con la búsqueda.'}
function transform(){let w=$('#world');if(w)w.setAttribute('transform',`translate(${pan.x},${pan.y}) scale(${zoom})`);$('#zoomLabel').textContent=Math.round(zoom*100)+'% · '+visibleNames.length+' entidades · '+visibleR.length+' FK'}
function fit(){if(!visibleNames.length)return;let minX=Math.min(...visibleNames.map(n=>positions[n].x))-35,minY=Math.min(...visibleNames.map(n=>positions[n].y))-35,maxX=Math.max(...visibleNames.map(n=>positions[n].x+W))+150,maxY=Math.max(...visibleNames.map(n=>positions[n].y+height(M[n])))+40;let box=$('#stage').getBoundingClientRect();zoom=Math.min(1.2,box.width/(maxX-minX),box.height/(maxY-minY));pan={x:(box.width-(maxX-minX)*zoom)/2-minX*zoom,y:(box.height-(maxY-minY)*zoom)/2-minY*zoom};transform()}
function zoomAt(f,x,y){let z=Math.max(.08,Math.min(3,zoom*f));pan.x=x-(x-pan.x)*z/zoom;pan.y=y-(y-pan.y)*z/zoom;zoom=z;transform()}
function selectEntity(n){diagramSelection=n;activeRel=null;draw();$('#relInfo').innerHTML=n?`<strong>${esc(M[n].friendly)}</strong> · <code>${esc(n)}</code><br>${esc(M[n].description)} <button data-open="${n}">Abrir diccionario</button> · ${related(n).length} relaciones declaradas.`:'Modelo completo. Selecciona una entidad o relación.'}
function initDiagram(){draw();fit();let stage=$('#stage'),drag=null,moved=false;stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;let node=e.target.closest('[data-node]');drag={id:node?.dataset.node,x:e.clientX,y:e.clientY,px:node?positions[node.dataset.node].x:pan.x,py:node?positions[node.dataset.node].y:pan.y};moved=false;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(drag.id){positions[drag.id]={x:drag.px+dx/zoom,y:drag.py+dy/zoom};draw()}else{pan={x:drag.px+dx,y:drag.py+dy};transform()}});stage.addEventListener('pointerup',e=>{if(!drag)return;let n=drag.id;drag=null;if(!moved&&n)selectEntity(n);else if(!moved){let box=stage.getBoundingClientRect(),hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-edge]');if(hit)selectRelation(+hit.dataset.edge)}stage.releasePointerCapture(e.pointerId)});stage.addEventListener('pointercancel',()=>drag=null);stage.addEventListener('wheel',e=>{e.preventDefault();let b=stage.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-b.left,e.clientY-b.top)},{passive:false});$('#zoomIn').onclick=()=>zoomAt(1.25,stage.clientWidth/2,stage.clientHeight/2);$('#zoomOut').onclick=()=>zoomAt(.8,stage.clientWidth/2,stage.clientHeight/2);$('#fit').onclick=fit;$('#resetLayout').onclick=()=>{defaultPositions();draw();fit()};$('#exportSvg').onclick=()=>exportDiagram('svg');$('#exportPng').onclick=()=>exportDiagram('png');$('#entitySearch').oninput=e=>{diagramQuery=e.target.value;draw();fit()};$('#entitySelect').onchange=e=>{selectEntity(e.target.value);fit()};$('#onlyConnected').onchange=e=>{onlyConnected=e.target.checked;draw();fit()};if(diagramSelection)selectEntity(diagramSelection)}
function selectRelation(id){activeRel=id;let r=R[id];draw();$('#relInfo').innerHTML=`<strong>${esc(r.name)} · ${cardinal(r)}</strong><p><code>${esc(r.from+'.'+r.columns.join(' + '))}</code> → <code>${esc(r.to+'.'+r.target.join(' + '))}</code></p><p>${esc(relExplanation(r))}</p><small>${esc(r.actions)}</small>`}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function exportDiagram(kind){if(!visibleNames.length){$('#relInfo').textContent='No hay entidades para exportar.';return}let x=Math.min(...visibleNames.map(n=>positions[n].x))-30,y=Math.min(...visibleNames.map(n=>positions[n].y))-30,w=Math.max(...visibleNames.map(n=>positions[n].x+W))-x+150,h=Math.max(...visibleNames.map(n=>positions[n].y+height(M[n])))-y+100;let style=$('style').textContent;let markup=`<svg xmlns="${NS}" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}"><style>${style}</style><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#f7faff"/>${visibleR.map(edgeMarkup).join('')}${visibleNames.map(n=>nodeMarkup(M[n])).join('')}${svgText(x+20,y+h-22,D.database+' · PK: primaria / FK: foránea · ○│ 0…1 · ││ 1 · ○⋔ 0…N · discontinua: destino no único','font-size="12" fill="#18334f"')}</svg>`;let blob=new Blob([markup],{type:'image/svg+xml;charset=utf-8'});if(kind==='svg'){download(blob,'DER_'+D.database+'.svg');return}let img=new Image(),url=URL.createObjectURL(blob);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1.5,7000/Math.max(w,h));c.width=Math.ceil(w*scale);c.height=Math.ceil(h*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>{if(b)download(b,'DER_'+D.database+'.png');else $('#relInfo').textContent='No se pudo exportar PNG; utiliza SVG.'},'image/png')};img.onerror=()=>{$('#relInfo').textContent='No se pudo exportar PNG; utiliza SVG.';URL.revokeObjectURL(url)};img.src=url}
function highlight(text,q){let n=norm(text),at=n.indexOf(norm(q));if(at<0)return esc(text);return esc(text.slice(0,at))+'<mark>'+esc(text.slice(at,at+q.length))+'</mark>'+esc(text.slice(at+q.length))}
const searchIndex=[...T.map(t=>({kind:'Tabla',label:t.friendly,sub:t.name+' · '+t.description,view:'tables',table:t.name})),...T.flatMap(t=>t.columns.map(c=>({kind:'Campo',label:c.name,sub:t.name+' · '+c.type+' · '+friendlyType(c.type)+' · '+c.description,view:'tables',table:t.name,field:c.name}))),...R.map(r=>({kind:'Relación',label:r.name,sub:r.from+' → '+r.to+' · '+r.columns+' → '+r.target+' · '+relExplanation(r),view:'der',relation:r.id})),...glossaryData.map(([term,d,example],i)=>({kind:'Concepto',label:term,sub:d+' '+example(),view:'glossary',term:i}))];let searchMatches=[];
$('#global').addEventListener('input',e=>{let q=e.target.value.trim();$('#results').hidden=!q;if(!q)return;let matches=searchIndex.filter(x=>norm(x.label+' '+x.sub).includes(norm(q)));searchMatches=matches.slice(0,45);$('#results').innerHTML=`<small style="display:block;padding:10px">${matches.length} coincidencias${matches.length>45?' · primeras 45; precisa tu búsqueda':''}</small>`+searchMatches.map((r,i)=>`<button data-result="${i}"><span class="pill">${r.kind}</span> ${highlight(r.label,q)}<small>${highlight(r.sub,q)}</small></button>`).join('')+(matches.length?'':'<p class="empty">No se encontraron resultados.</p>')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#results').hidden=true});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b){if(!e.target.closest('.search-wrap'))$('#results').hidden=true;return}if(b.dataset.view)go(b.dataset.view);if(b.dataset.open)go('tables',b.dataset.open);if(b.dataset.diagram){diagramSelection=b.dataset.diagram;diagramQuery='';onlyConnected=true;go('der')}if(b.dataset.rel!==undefined){let r=R[+b.dataset.rel];diagramSelection=r.from;diagramQuery='';onlyConnected=true;go('der');selectRelation(r.id)}if(b.dataset.result!==undefined){let r=searchMatches[+b.dataset.result];if(r.relation!==undefined){diagramSelection=R[r.relation].from;onlyConnected=true;diagramQuery='';go('der');selectRelation(r.relation)}else{go(r.view,r.table);if(r.field){let el=document.getElementById('field-'+r.field);el?.scrollIntoView({block:'center'});if(el)el.style.background='#fff5d7'}if(r.term!==undefined)document.getElementById('term-'+r.term)?.scrollIntoView({block:'center'})}}});
document.addEventListener('input',e=>{if(e.target.id==='tableSearch'){let q=norm(e.target.value),filtered=T.filter(t=>norm(t.name+' '+t.friendly+' '+t.description).includes(q));$('#tableGrid').innerHTML=filtered.map(tableCard).join('')||'<div class="empty">No hay tablas coincidentes.</div>';$('#tableCount').textContent=filtered.length+' tablas'}});
document.addEventListener('change',e=>{if(e.target.id==='typeFilter')$('#columnsBody').innerHTML=columnRows(M[selected],e.target.value);if(e.target.id==='relationFilter')$('#relationList').innerHTML=(e.target.value?related(e.target.value):R).map(relCard).join('')||'<p>No hay claves foráneas declaradas para esta tabla.</p>'});
go('home');
</script></body></html>
